# ==============================================================================
#                      WORLDX CENTRAL CONFIGURATION FILE
# ==============================================================================

# Global Plugin Settings
plugin:
  prefix: "<gradient:#9B51E0:#2F80ED>[WorldX]</gradient> "
  debug-mode: false
  language: "fr"

# Centralized Feature Toggles (Enable/Disable any feature system)
features:
  editing: true          # WorldEdit commands (//set, //replace, //cut, //copy, //paste, etc.)
  brushes: true          # Terraforming & sculpting brushes (/brush)
  schematics: true       # Schematic save, load, history, cloud share & import (/schem)
  animated-3d: true      # 3D BlockDisplay animated schematics (/schem animate)
  protection: true       # Region protection & spatial index check
  claim-system: false    # Player self-service claiming & upgrades (/rg claim, /rg upgrade)
  dungeons: true         # Procedural dungeon generator (/worldx dungeon)
  timemachine: true      # Regional time machine travel (/rg timemachine)
  analytics: true        # Regional statistics & in-game particle heatmap (/worldx analytics)
  reforestation: true    # Natural tree reforestation engine
  gui-menus: true        # GUI menus (/rg gui, /schem gui, /worldx palette)
  artistic-filters: true # Artistic selection filters (//filter)

# Database settings
# Supported types: sqlite, mysql
database:
  type: "sqlite"
  sqlite:
    file-name: "regions.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "worldx"
    username: "root"
    password: ""
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      connection-timeout: 30000

# Editing Engine settings (WorldEdit equivalent)
edit:
  wand-item: "WOODEN_AXE"
  brush-item: "BLAZE_ROD"
  default-quota: 10000
  max-blocks-per-edit: 500000
  max-undo-history-per-player: 20
  async:
    blocks-per-tick: 5000
    notify-on-complete: true

# Protection settings (WorldGuard equivalent)
protection:
  enable-chunk-cache: true
  default-priority: 0
  intrusion-alert-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

# Player Claim & Upgrade Settings
claim:
  enable: false
  default-budget: 10000
  default-max-count: 3
  default-max-blocks: 50000
  upgrade-expand-cost-per-block: 10.0
  upgrade-member-slot-cost: 500.0

# Procedural Dungeon Engine Settings
dungeons:
  default-room-count: 3
  default-room-size: 7
  default-room-height: 5
  wall-material: "STONE_BRICKS"
  floor-material: "SMOOTH_STONE"

# Time Machine Engine Settings
timemachine:
  particle-type: "PORTAL"
  particle-count: 50

# Reforestation Engine Settings
reforestation:
  regrowth-delay-seconds: 10
  max-queue: 5000
  particle-type: "VILLAGER_HAPPY"
  play-sound: true
  sound-name: "BLOCK_GRASS_PLACE"

# Visualization settings
visual:
  mode: "display" # particle or display
  highlight-duration-seconds: 15

# Integration settings
integration:
  vault-economy-enabled: true
  discord-webhook-url: ""

# Redis Multi-Server Sync Settings
redis:
  enable: false
  host: "localhost"
  port: 6379
  password: ""
  channel: "worldx_sync"
  server-id: "server-1"


