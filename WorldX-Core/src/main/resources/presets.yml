# WorldX - Presets Configuration
# Ce fichier contient les groupes de flags (presets) applicables aux régions.
# Vous pouvez appliquer un preset en jeu avec la commande : /rg apply-preset <region> <preset>

spawn:
  pvp: deny
  build: deny
  use: allow
  mob-spawn: deny
  god-mode: allow
  hunger: deny
  fall-damage: deny
  greeting: "§aBienvenue au Spawn !"
  farewell: "§cVous quittez le Spawn."

